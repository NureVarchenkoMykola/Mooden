<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooden | Сповіщення</title>
    <meta name="page-role" content="moderator">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

    <script src="../js/config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/i18n-manager.js"></script>
    <script src="../js/theme-manager.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/sidebar-manager.js"></script>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/user-notifications.css">
</head>

<body class="dashboard-layout container">

<aside class="sidebar">
    <div class="sidebar-top">
        <div class="logo">Mooden</div>

        <nav class="nav-menu">
            <p class="nav-label" data-i18n="common.nav_label_main">НАВІГАЦІЯ</p>

            <a href="./moderator-dashboard.html" class="nav-link">
                <span data-i18n="moderator_nav.dashboard">🛡️ Панель</span>
            </a>

            <a href="./moderator-users.html" class="nav-link">
                <span data-i18n="moderator_nav.users">👥 Користувачі</span>
            </a>

            <a href="./moderator-courses.html" class="nav-link">
                <span data-i18n="moderator_nav.courses">📚 Курси</span>
            </a>

            <a href="./moderator-activity.html" class="nav-link">
                <span data-i18n="moderator_nav.activity">📌 Активність</span>
            </a>
        </nav>

        <nav class="nav-menu">
            <p class="nav-label" data-i18n="common.nav_label_community">СПІЛЬНОТА</p>

            <a href="./moderator-announcements.html" class="nav-link">
                <span data-i18n="common.nav_announcements">📢 Оголошення</span>
                <span class="badge-count" id="announcementsBadge">0</span>
            </a>

            <a href="./moderator-notifications.html" class="nav-link active">
                <span data-i18n="common.nav_notifications">🔔 Сповіщення</span>
                <span class="badge-count" id="notifBadge">0</span>
            </a>
        </nav>
    </div>

    <div class="sidebar-user">
        <a href="./moderator-profile.html" class="user-card user-card-link" id="profileBottomLink">
            <div class="user-avatar" id="avatarInitial">?</div>

            <div class="user-meta">
                <p class="user-name" id="profileName">...</p>
                <p class="user-sub" id="profileRole" data-i18n="dashboard.user_loading">Завантаження...</p>
            </div>
        </a>

        <div class="theme-switch-container">
            <button id="themeToggle" class="theme-toggle-btn">
                <span class="theme-icon">🌙</span>
                <span class="theme-text" data-i18n="common.theme_dark">Темна тема</span>
            </button>
        </div>

        <div class="lang-switch-container">
            <div class="lang-slider">
                <input type="radio" name="lang" id="lang-uk" value="uk">
                <label for="lang-uk">UA</label>

                <input type="radio" name="lang" id="lang-en" value="en">
                <label for="lang-en">EN</label>

                <div class="slider-bg"></div>
            </div>
        </div>

        <button id="logoutBtn" class="logout-btn" data-i18n="common.logout_btn">
            🚪 Вийти з акаунту
        </button>
    </div>
</aside>

<main class="main-content">
    <div class="mobile-header">
        <button id="menuToggle" class="menu-btn">☰</button>
        <div class="logo-mobile">Mooden</div>
    </div>

    <header class="notifications-header">
        <h1 data-i18n="notifications.title">Сповіщення</h1>
        <p class="header-desc" data-i18n="notifications.subtitle">Ваші особисті повідомлення</p>
    </header>

    <section class="notifications-stats">
        <div class="notification-stat-card">
            <span>🔔</span>
            <div>
                <strong id="totalNotifications">0</strong>
                <p data-i18n="notifications.stat_total">Усього</p>
            </div>
        </div>

        <div class="notification-stat-card">
            <span>📩</span>
            <div>
                <strong id="unreadNotifications">0</strong>
                <p data-i18n="notifications.stat_unread">Непрочитані</p>
            </div>
        </div>

        <div class="notification-stat-card">
            <span>✅</span>
            <div>
                <strong id="readNotifications">0</strong>
                <p data-i18n="notifications.stat_read">Прочитані</p>
            </div>
        </div>
    </section>

    <section class="notifications-card">
        <div class="notifications-head">
            <h2 data-i18n="notifications.list_title">Усі сповіщення</h2>

            <button id="markAllReadBtn"
                    class="mark-all-btn"
                    type="button"
                    data-i18n="notifications.mark_all_read">
                Позначити всі як прочитані
            </button>
        </div>

        <section class="notifications-controls">
            <input
                id="notificationSearch"
                class="notification-search"
                type="text"
                data-i18n-placeholder="notifications.search_placeholder"
                placeholder="Пошук сповіщень..."
            >

            <select id="notificationFilter" class="notification-select">
                <option value="all" data-i18n="notifications.filter_all">Усі</option>
                <option value="unread" data-i18n="notifications.filter_unread">Непрочитані</option>
                <option value="read" data-i18n="notifications.filter_read">Прочитані</option>
            </select>
        </section>

        <div id="notificationsList" class="notifications-list"></div>
    </section>
</main>

<script src="../js/user-notifications.js"></script>
</body>
</html>
