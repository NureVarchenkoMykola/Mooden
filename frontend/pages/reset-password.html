<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooden | Новий пароль</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

    <script src="../js/config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/i18n-manager.js"></script>
    <script src="../js/theme-manager.js"></script>
    <script src="../js/toast.js"></script>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="auth-page">
    <div class="container main-flow">
        <div class="header-row">
            <a href="../index.html" class="logo">Mooden</a>

            <div class="header-controls">
                <button id="themeToggle" class="theme-toggle-btn">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text" data-i18n="common.theme_dark">Темна тема</span>
                </button>

                <div class="lang-switch-container">
                    <div class="lang-slider" style="width: 100px;">
                        <input type="radio" name="lang" id="lang-uk" value="uk">
                        <label for="lang-uk">UA</label>

                        <input type="radio" name="lang" id="lang-en" value="en">
                        <label for="lang-en">EN</label>

                        <div class="slider-bg"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="login-box auth-single-box">
            <header class="login-header">
                <h2 data-i18n="password_reset.reset_title">Новий пароль</h2>
                <p data-i18n="password_reset.reset_subtitle">
                    Введіть новий пароль і підтвердіть його.
                </p>
            </header>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <label data-i18n="password_reset.new_password">Новий пароль</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="passwordInput"
                            minlength="6"
                            placeholder="••••••••"
                            required
                        >

                        <button type="button" class="password-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 class="eye-closed">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>

                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                 class="eye-open">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label data-i18n="password_reset.confirm_password">Підтвердіть пароль</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirmPasswordInput"
                            minlength="6"
                            placeholder="••••••••"
                            required
                        >

                        <button type="button" class="password-toggle">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="eye-closed">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>

                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                class="eye-open">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" data-i18n="password_reset.update_password">
                    Оновити пароль
                </button>
            </form>

            <p class="signup-text">
                <a href="../index.html" data-i18n="password_reset.back_to_login">Повернутися до входу</a>
            </p>
        </section>
    </div>
</main>

<script src="../js/toggle-password.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
