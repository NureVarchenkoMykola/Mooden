<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mooden | Відновлення пароля</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/icons/favicon.png">

    <script src="../js/config.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/i18n-manager.js"></script>
    <script src="../js/theme-manager.js"></script>
    <script src="../js/toast.js"></script>

    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<main class="auth-page">
    <div class="container main-flow">
        <div class="header-row">
            <a href="../index.html" class="logo">Mooden</a>

            <div class="header-controls">
                <button id="themeToggle" class="theme-toggle-btn">
                    <span class="theme-icon">🌙</span>
                    <span class="theme-text" data-i18n="common.theme_dark">Темна тема</span>
                </button>

                <div class="lang-switch-container">
                    <div class="lang-slider" style="width: 100px;">
                        <input type="radio" name="lang" id="lang-uk" value="uk">
                        <label for="lang-uk">UA</label>

                        <input type="radio" name="lang" id="lang-en" value="en">
                        <label for="lang-en">EN</label>

                        <div class="slider-bg"></div>
                    </div>
                </div>
            </div>
        </div>

        <section class="login-box auth-single-box">
            <header class="login-header">
                <h2 data-i18n="password_reset.forgot_title">Відновлення пароля</h2>
                <p data-i18n="password_reset.forgot_subtitle">
                    Введіть email, і ми надішлемо посилання для відновлення пароля.
                </p>
            </header>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <label data-i18n="login.email_label">ЕЛЕКТРОННА ПОШТА</label>
                    <input
                        type="email"
                        id="emailInput"
                        placeholder="you@university.edu.ua"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary" data-i18n="password_reset.send_link">
                    Надіслати посилання
                </button>
            </form>

            <p class="signup-text">
                <a href="../index.html" data-i18n="password_reset.back_to_login">Повернутися до входу</a>
            </p>
        </section>
    </div>
</main>

<script src="../js/forgot-password.js"></script>
</body>
</html>
